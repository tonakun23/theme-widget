org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx512m
# Heap thấp vì máy build (VM) ít RAM trống — daemon Gradle 2GB bị kill
# khi bắt đầu build (09/11/2026); tăng lại nếu máy có RAM dư.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Thư viện Rust (.so) do cargo-ndk build ra đặt ở app/src/main/jniLibs/<abi>/
# Gradle tự chạy cargo trước khi build APK (gắn vào task preBuild, Giai đoạn 2).
